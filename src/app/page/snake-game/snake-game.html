<section class="snake-shell">
  <header class="snake-header">
    <h2>Snake</h2>
    <div class="snake-controls">
      <span class="snake-score">Score: {{ statManager.score() }}</span>
      @if (statManager.gameOver()) {
        <span class="snake-score">Game over</span>
      }
      <button type="button" (click)="restart()">Restart</button>
    </div>
  </header>

  <canvas #canvas></canvas>
  @if (statManager.gameOver()) {
    <app-game-over-screen [show]="statManager.gameOver()" [score]="statManager.score()" (restart)="restart()" />
  }
</section>
