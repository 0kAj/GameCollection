<div class="home-screen">
  <app-arcade-title text="GAME COLLECTION" fontSize="48px" />
  
  <app-arcade-game-selector (selectGame)="openGame($event)" />
  <app-pet (openPetUI)="togglePetUI()" />

  @if (petUIOpen()) {
    <app-pet-ui (close)="togglePetUI()" [show]="petUIOpen()" />
  }

  <app-score-board />
</div>
