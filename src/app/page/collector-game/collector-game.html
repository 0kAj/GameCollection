<section class="collector-shell position-relative">
  <header class="collector-header">
    <h2>Collector</h2>
    <app-score-board />

    <div class="collector-controls">
      <span
        [class.text-warning]="statManager.timeleft() <= 30 && statManager.timeleft() > 10"
        [class.text-danger]="statManager.timeleft() <= 10"
        [class.fw-bold]="statManager.timeleft() <= 10"
      >
        Time left: {{ statManager.timeleft() | timeFormat: false }}
      </span>
      <span>Combo: {{ statManager.combo() }}</span>
      <span class="collector-score">Score: {{ statManager.score() }}</span>
      @if (statManager.gameOver()) {
        <span class="collector-score">Game over</span>
      }
    </div>
    <button type="button" (click)="restart()">Restart</button>
  </header>
  <canvas #canvas></canvas>
  <app-game-over-screen
    [show]="statManager.gameOver()"
    [score]="statManager.score()"
    (restart)="restart()"
  />
</section>
