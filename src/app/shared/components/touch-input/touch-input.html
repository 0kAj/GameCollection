@if (keyboardInput.isTouchDevice) {
  <div class="arrow-keys position-absolute start-50 translate-middle-x">
    <div class="top-row">
      <button
        class="key btn btn-secondary"
        (pointerdown)="onUpPress()"
        (pointerup)="onUpRelease()"
        (pointercancel)="onUpRelease()"
        (pointerleave)="onUpRelease()"
      >
        ↑
      </button>
    </div>

    <div class="bottom-row">
      <button
        class="key btn btn-secondary"
        (pointerdown)="onLeftPress()"
        (pointerup)="onLeftRelease()"
        (pointercancel)="onLeftRelease()"
        (pointerleave)="onLeftRelease()"
      >
        ←
      </button>
      <button
        class="key btn btn-secondary"
        (pointerdown)="onDownPress()"
        (pointerup)="onDownRelease()"
        (pointercancel)="onDownRelease()"
        (pointerleave)="onDownRelease()"
      >
        ↓
      </button>
      <button
        class="key btn btn-secondary"
        (pointerdown)="onRightPress()"
        (pointerup)="onRightRelease()"
        (pointercancel)="onRightRelease()"
        (pointerleave)="onRightRelease()"
      >
        →
      </button>
    </div>
  </div>
}
