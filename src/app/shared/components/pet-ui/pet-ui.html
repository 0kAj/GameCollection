<div class="pet-backdrop" (click)="close.emit()">
  <div class="pet-modal" (click)="$event.stopPropagation()">
    <h3 class="pet-title">Your Pet</h3>

    <img class="pet-image" src="assets/pets/Mouse.png" [class.feeding]="feeding()" alt="Pet" />
    <div class="pet-actions">
      <button class="btn btn-primary" [disabled]="statManager.score() <= 0 || feeding()" (click)="feed()">
        Feed
      </button>
      <button class="btn btn-secondary" (click)="close.emit()">Close</button>
    </div>
  </div>
</div>
