<div class="gameover-overlay d-flex justify-content-center align-items-center">
  <div class="card text-center shadow-lg gameover-card">
    <div class="card-body">
      <h1 class="mb-3">Game Over</h1>

      <p class="mb-4">Final Score: {{ score }}</p>

      <button class="btn btn-primary" (click)="restart.emit()">
        Play Again
      </button>
    </div>
  </div>
</div>
